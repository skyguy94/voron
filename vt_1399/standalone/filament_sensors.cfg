[filament_switch_sensor fil_entry]
switch_pin: ^toolhead:LIMIT4
pause_on_runout: False
runout_gcode: _FILAMENT_RUNOUT SENSOR=fil_entry
insert_gcode: _FILAMENT_INSERT SENSOR=fil_entry
event_delay: 3.0

[filament_switch_sensor fil_toolhead]
switch_pin: ^toolhead:LIMIT3
pause_on_runout: False
runout_gcode: _FILAMENT_RUNOUT SENSOR=fil_toolhead
event_delay: 3.0
