[gcode_macro _FILAMENT_VARS]
description: Filament path geometry and speeds for standalone mode
gcode: # Leave empty

# Copied from mmu_parameters.cfg:277-299, keep in sync.
variable_inlet_to_entry         : 0.0		; toolhead inlet (ECAS) to fil_entry switch
variable_entry_to_extruder      : 13.5		; fil_entry switch to extruder gears
variable_extruder_to_nozzle     : 96.0		; extruder gears to nozzle
variable_sensor_to_nozzle       : 78.0		; fil_toolhead switch to nozzle
variable_residual_filament      : 36.0		; left in the hotend by a cut unload

variable_gear_grip_margin       : 8.0		; park this far below the gears

variable_purge_length           : 40.0
variable_min_temp               : 200
variable_default_temp           : 240

# mm/min
variable_load_speed             : 600
variable_purge_speed            : 180
variable_unload_speed           : 960		; 16 mm/s, matches HH extruder_unload_speed
variable_unload_slow_speed      : 480		; 8 mm/s, HH runs the first move out of the melt zone at 50%

variable_runout_retract         : 3.0
variable_use_cutter             : True

variable_park_x                 : 26
variable_park_y                 : 307
variable_park_z_min             : 2.0		; Safety floor, matches MMU min_toolchange_z
variable_park_travel_speed      : 350		; mm/s
variable_park_lift_speed        : 15		; mm/s
variable_clean_after_load       : True		; MMU runs CLEAN_NOZZLE as user_post_load_extension

variable_sensors_trusted        : False


[gcode_macro _FILAMENT_STATE]
description: How far the filament tip has advanced, in mm from the toolhead inlet
gcode: # Leave empty

variable_tip_depth              : 0.0
variable_tip_known              : 0


[gcode_macro SET_TIP_DEPTH]
description: Record how far the tip has advanced from the toolhead inlet. Params: DEPTH UNKNOWN=<0|1>
gcode:
    {% set unknown = params.UNKNOWN|default(0)|int %}
    {% if unknown %}
        SET_GCODE_VARIABLE MACRO=_FILAMENT_STATE VARIABLE=tip_known VALUE=0
        RESPOND MSG="Filament tip position marked unknown."
    {% else %}
        {% set v = printer['gcode_macro _FILAMENT_VARS'] %}
        {% set nozzle = v.inlet_to_entry|float + v.entry_to_extruder|float + v.extruder_to_nozzle|float %}
        {% set d = params.DEPTH|float %}
        SET_GCODE_VARIABLE MACRO=_FILAMENT_STATE VARIABLE=tip_depth VALUE={d}
        SET_GCODE_VARIABLE MACRO=_FILAMENT_STATE VARIABLE=tip_known VALUE=1
        RESPOND MSG="Filament tip at {d|round(1)}mm into the toolhead, {(nozzle - d)|round(1)}mm short of the nozzle."
    {% endif %}


[gcode_macro _FILAMENT_SENSORS]
description: Enable or disable both filament switches. ENABLE=0 remembers the
             previous state so RESTORE=1 can put it back. Params: ENABLE RESTORE
variable_was_entry              : 1
variable_was_toolhead           : 1
gcode:
    {% if params.RESTORE|default(0)|int %}
        {% set me = printer['gcode_macro _FILAMENT_SENSORS'] %}
        SET_FILAMENT_SENSOR SENSOR=fil_entry ENABLE={me.was_entry}
        SET_FILAMENT_SENSOR SENSOR=fil_toolhead ENABLE={me.was_toolhead}
    {% else %}
        {% set en = params.ENABLE|default(1)|int %}
        {% if not en %}
            SET_GCODE_VARIABLE MACRO=_FILAMENT_SENSORS VARIABLE=was_entry VALUE={1 if printer['filament_switch_sensor fil_entry'].enabled else 0}
            SET_GCODE_VARIABLE MACRO=_FILAMENT_SENSORS VARIABLE=was_toolhead VALUE={1 if printer['filament_switch_sensor fil_toolhead'].enabled else 0}
        {% endif %}
        SET_FILAMENT_SENSOR SENSOR=fil_entry ENABLE={en}
        SET_FILAMENT_SENSOR SENSOR=fil_toolhead ENABLE={en}
    {% endif %}


[gcode_macro _FILAMENT_HEAT]
description: Heat the extruder for filament work, announcing the wait. Params: TEMP
gcode:
    {% set v = printer['gcode_macro _FILAMENT_VARS'] %}
    {% set e = printer[printer.toolhead.extruder] %}
    {% set temp = params.TEMP|default(v.default_temp)|float %}
    {% set now = e.temperature|float %}

    {% if now >= temp - 2 and e.target|float >= temp %}
        RESPOND MSG="Extruder already at {now|round(0)|int}C, no wait."
    {% else %}
        STATUS_HEATING
        RESPOND MSG="Heating extruder {now|round(0)|int}C to {temp|round(0)|int}C."
        M109 S{temp}
        RESPOND MSG="Extruder at {temp|round(0)|int}C."
    {% endif %}


[gcode_macro _FILAMENT_PARK]
description: Move to the purge position beside the brush. Mirrors the MMU pre_load/pre_unload park
gcode:
    {% set v = printer['gcode_macro _FILAMENT_VARS'] %}

    {% if 'xy' in printer.toolhead.homed_axes %}
        SAVE_GCODE_STATE NAME=_FILAMENT_PARK
        G90
        {% if 'z' in printer.toolhead.homed_axes %}
            {% set z = [printer.gcode_move.gcode_position.z|float, v.park_z_min|float]|max %}
            G1 Z{z} F{v.park_lift_speed * 60}
        {% endif %}
        G1 X{v.park_x} Y{v.park_y} F{v.park_travel_speed * 60}
        RESTORE_GCODE_STATE NAME=_FILAMENT_PARK MOVE=0
    {% else %}
        RESPOND TYPE=error MSG="Not homed, skipping purge park. Filament will ooze wherever the toolhead is."
    {% endif %}


[gcode_macro _FILAMENT_RUNOUT]
gcode:
    {% set v = printer['gcode_macro _FILAMENT_VARS'] %}
    {% set sensor = params.SENSOR|default('filament')|string %}

    {% if printer.print_stats.state != 'printing' %}
        { action_respond_info("Filament runout on %s while not printing, ignored" % sensor) }
    {% else %}
        RESPOND TYPE=error MSG="Filament runout detected on {sensor}, pausing print"
        M117 FILAMENT RUNOUT
        PAUSE CLEAN=0 E={v.runout_retract}
        STOP_LED_EFFECTS
        SET_LED_EFFECT EFFECT=sb_critical_error
    {% endif %}


[gcode_macro _FILAMENT_INSERT]
gcode:
    {% set sensor = params.SENSOR|default('filament')|string %}
    {% if printer.print_stats.state == 'paused' %}
        RESPOND MSG="Filament detected on {sensor}. Run LOAD_FILAMENT, then RESUME."
    {% else %}
        RESPOND MSG="Filament detected on {sensor}. Run LOAD_FILAMENT to load it."
    {% endif %}


[gcode_macro LOAD_FILAMENT]
description: Heat, feed filament to the nozzle and purge. Params: TEMP PURGE TIP
gcode:
    {% set v = printer['gcode_macro _FILAMENT_VARS'] %}
    {% set st = printer['gcode_macro _FILAMENT_STATE'] %}
    {% set e = printer[printer.toolhead.extruder] %}
    {% set cur = e.target|float %}
    {% set temp = params.TEMP|default(cur if cur >= v.min_temp|float else v.default_temp)|float %}
    {% set purge = params.PURGE|default(v.purge_length)|float %}

    {% set nozzle = v.inlet_to_entry|float + v.entry_to_extruder|float + v.extruder_to_nozzle|float %}
    {% set loaded = nozzle - 2.0 %}
    {% set given = 'TIP' in params %}
    {% set depth = params.TIP|default(st.tip_depth if st.tip_known|int else loaded)|float %}
    {% set to_go = [nozzle - depth, 0.0]|max %}
    {% set feed  = [to_go - v.residual_filament|float, 0.0]|max %}

    {% if printer.print_stats.state == 'printing' %}
        { action_raise_error("LOAD_FILAMENT: cannot load during an active print. Pause first.") }
    {% elif temp < v.min_temp|float %}
        { action_raise_error("LOAD_FILAMENT: TEMP %.0f is below min_temp %.0f" % (temp, v.min_temp|float)) }
    {% elif depth < -1.0 or depth > nozzle + 1.0 %}
        { action_raise_error("LOAD_FILAMENT: TIP %.1f is outside the toolhead path 0..%.1f" % (depth, nozzle)) }
    {% else %}
        _FILAMENT_SENSORS ENABLE=0

        {% if not given and not st.tip_known|int %}
            RESPOND TYPE=error MSG="Tip position unknown, assuming it is at the nozzle. If you just threaded a new spool run LOAD_FILAMENT TIP=0 instead."
        {% endif %}

        _FILAMENT_PARK

        M117 Heating to load
        _FILAMENT_HEAT TEMP={temp}

        SAVE_GCODE_STATE NAME=_LOAD_FILAMENT
        M83
        M117 Loading
        RESPOND MSG="Loading: tip {depth|round(1)}mm in, {to_go|round(1)}mm to the nozzle. Feeding {feed|round(1)}mm then purging {purge|round(1)}mm."
        {% if feed > 0 %}
            G1 E{feed} F{v.load_speed}
        {% endif %}
        {% if purge > 0 %}
            G1 E{purge} F{v.purge_speed}
        {% endif %}
        G1 E-2.0 F{v.purge_speed}
        M400
        RESTORE_GCODE_STATE NAME=_LOAD_FILAMENT MOVE=0
        SET_TIP_DEPTH DEPTH={loaded}

        {% if v.clean_after_load and 'xy' in printer.toolhead.homed_axes %}
            CLEAN_NOZZLE
            M400
        {% endif %}

        _FILAMENT_SENSORS RESTORE=1

        {% if v.sensors_trusted and not printer['filament_switch_sensor fil_toolhead'].filament_detected %}
            M117 Load failed
            RESPOND TYPE=error MSG="Load finished but fil_toolhead reads empty."
            STOP_LED_EFFECTS
            SET_LED_EFFECT EFFECT=sb_critical_error
        {% else %}
            M117 Loaded
            RESPOND MSG="Filament loaded, tip at the nozzle."
            STATUS_READY
        {% endif %}
    {% endif %}


[gcode_macro UNLOAD_FILAMENT]
description: Cut and retract filament clear of the extruder gears. Params: TEMP CUT=<0|1> TIP
gcode:
    {% set v = printer['gcode_macro _FILAMENT_VARS'] %}
    {% set c = printer['gcode_macro _CUTTER_VARS'] %}
    {% set st = printer['gcode_macro _FILAMENT_STATE'] %}
    {% set e = printer[printer.toolhead.extruder] %}
    {% set cur = e.target|float %}
    {% set temp = params.TEMP|default(cur if cur >= v.min_temp|float else v.default_temp)|float %}
    {% set cut = params.CUT|default(1 if v.use_cutter else 0)|int %}

    {% set nozzle = v.inlet_to_entry|float + v.entry_to_extruder|float + v.extruder_to_nozzle|float %}
    {% set loaded = nozzle - 2.0 %}
    {% set depth  = params.TIP|default(st.tip_depth if st.tip_known|int else loaded)|float %}
    {% set park_depth = v.inlet_to_entry|float + v.entry_to_extruder|float + v.gear_grip_margin|float %}

    {% if printer.print_stats.state == 'printing' %}
        { action_raise_error("UNLOAD_FILAMENT: cannot unload during an active print. Pause first.") }
    {% elif temp < v.min_temp|float %}
        { action_raise_error("UNLOAD_FILAMENT: TEMP %.0f is below min_temp %.0f" % (temp, v.min_temp|float)) }
    {% elif depth < -1.0 or depth > nozzle + 1.0 %}
        { action_raise_error("UNLOAD_FILAMENT: TIP %.1f is outside the toolhead path 0..%.1f" % (depth, nozzle)) }
    {% elif cut and 'xy' not in printer.toolhead.homed_axes %}
        { action_raise_error("UNLOAD_FILAMENT: cutting needs X and Y homed. G28 X Y first, or pass CUT=0.") }
    {% else %}
        _FILAMENT_SENSORS ENABLE=0

        _FILAMENT_PARK

        M117 Heating to unload
        _FILAMENT_HEAT TEMP={temp}

        {% set blade_depth = nozzle - c.blade_pos|float %}
        {% set will_cut = cut and depth > blade_depth %}

        {% if cut and not will_cut %}
            RESPOND MSG="Tip is already {depth|round(1)}mm in, above the blade at {blade_depth|round(1)}mm. Skipping the cut."
        {% endif %}
        {% if will_cut %}
            M117 Cutting
            CUT_FILAMENT SENSORS=0 TIP={depth}
        {% endif %}

        {% set after = (nozzle - c.blade_pos|float - c.rip_length|float) if will_cut else depth %}
        {% set remaining = [after - park_depth, 0.0]|max %}

        SAVE_GCODE_STATE NAME=_UNLOAD_FILAMENT
        M83
        M117 Unloading
        {% if not will_cut %}
            G1 E-15 F{v.unload_speed}
            G1 E10 F{v.purge_speed}
        {% endif %}
        {% if remaining > 0 %}
            G1 E-{remaining} F{v.unload_slow_speed}
        {% endif %}
        M400
        RESTORE_GCODE_STATE NAME=_UNLOAD_FILAMENT MOVE=0
        SET_TIP_DEPTH DEPTH={park_depth}

        _FILAMENT_SENSORS RESTORE=1

        {% if v.sensors_trusted and printer['filament_switch_sensor fil_toolhead'].filament_detected %}
            M117 Unload short
            RESPOND TYPE=error MSG="fil_toolhead still reads filament, so the tip is past {(nozzle - v.sensor_to_nozzle|float)|round(1)}mm. The extruder slipped."
        {% else %}
            M117 Unloaded
            RESPOND MSG="Filament {'cut and ' if will_cut else ''}parked {park_depth|round(1)}mm in from the toolhead inlet. The end sits {v.gear_grip_margin|round(1)}mm below the gears, so they still grip it. LOAD_FILAMENT to reload, or release the idler and pull it out to change spools."
            STATUS_READY
        {% endif %}
    {% endif %}


[gcode_macro _MENU_UNLOAD]
description: Menu wrapper. Homes XY if needed so the cut is never silently skipped
gcode:
    {% if 'xy' not in printer.toolhead.homed_axes %}
        G28 X Y
    {% endif %}
    UNLOAD_FILAMENT CUT=1


[gcode_macro _MENU_LOAD]
description: Menu wrapper. Homes XY so the purge lands at the park position
gcode:
    {% if 'xy' not in printer.toolhead.homed_axes %}
        G28 X Y
    {% endif %}
    LOAD_FILAMENT
