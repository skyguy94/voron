#####################################################################
#   Toolhead filament cutter (standalone mode)
#####################################################################
# Geometry copied from [_MMU_CUT_TIP_VARS] in mmu/base/mmu_macro_vars.cfg.

[gcode_macro _CUTTER_VARS]
description: Toolhead cutter geometry and speeds for standalone mode
gcode: # Leave empty

variable_enabled                : True		; False to make CUT_FILAMENT a no-op

variable_blade_pos              : 69		; Distance in mm from internal nozzle tip to the blade
variable_retract_length         : 45		; Retract before cutting. Must be less than blade_pos
variable_simple_tip_forming     : False		; Extra in/out move after retract to cool the tip

variable_cutting_axis           : "y"
variable_pin_loc_xy             : 0, 292	; Toolhead position where the cutter arm just touches the pin
variable_pin_park_dist          : -5.0		; Run-up offset applied along cutting_axis
variable_pin_loc_compressed_xy  : 0, 307	; Toolhead position with the cutter fully compressed
variable_safe_margin_xy         : 30, 30	; Approx toolhead footprint, used to plan a safe approach

variable_rip_length             : 1.0
variable_rip_speed              : 3		; mm/s

variable_pushback_length        : 25.0		; PTFE tube length + 3mm is a good start
variable_pushback_dwell_time    : 0		; ms

# Speeds
variable_travel_speed           : 150		; mm/s
variable_cut_fast_move_speed    : 32		; mm/s
variable_cut_slow_move_speed    : 8		; mm/s
variable_evacuate_speed         : 150		; mm/s
variable_extruder_move_speed    : 25		; mm/s
variable_cut_dwell_time         : 50		; ms
variable_cut_fast_move_fraction : 0.2		; Fraction of the park-to-compressed stroke done at fast speed
variable_cut_z_hop              : 2.0		; mm of Z clearance taken before travelling to the pin

variable_cut_axis_steppers      : 'stepper_x, stepper_y'
variable_cut_stepper_driver     : 'tmc5160'	; Driver section prefix for the steppers listed above
variable_cut_stepper_current    : 100		; % of configured run_current


[gcode_macro CUT_FILAMENT]
description: Cut the filament at the toolhead cutter. Params: RETRACT TIP PUSHBACK SENSORS=<0|1>
gcode:
    {% set v = printer['gcode_macro _CUTTER_VARS'] %}
    {% set fv = printer['gcode_macro _FILAMENT_VARS'] %}
    {% set st = printer['gcode_macro _FILAMENT_STATE'] %}
    {% set e = printer[printer.toolhead.extruder] %}

    {% if printer.print_stats.state == 'printing' %}
        { action_raise_error("CUT_FILAMENT: cannot cut during an active print. Pause first.") }
    {% elif not v.enabled %}
        { action_respond_info("CUT_FILAMENT: cutter disabled in _CUTTER_VARS, skipping") }
    {% elif 'xy' not in printer.toolhead.homed_axes %}
        { action_raise_error("CUT_FILAMENT: X and Y must be homed first") }
    {% elif not e.can_extrude %}
        { action_raise_error("CUT_FILAMENT: extruder is below min_extrude_temp") }
    {% elif e.temperature|float < fv.min_temp|float %}
        { action_raise_error("CUT_FILAMENT: extruder at %.0fC is below _FILAMENT_VARS.min_temp %.0fC"
                             % (e.temperature|float, fv.min_temp|float)) }
    {% else %}
        {% set nozzle   = fv.inlet_to_entry|float + fv.entry_to_extruder|float + fv.extruder_to_nozzle|float %}
        {% set target   = params.RETRACT|default(v.retract_length)|float %}
        {% set depth    = params.TIP|default(st.tip_depth if st.tip_known|int else nozzle - 2.0)|float %}
        {% set tip_at   = nozzle - depth %}
        {% set retract  = [target - tip_at, 0.0]|max %}
        {% set pushback = params.PUSHBACK|default(1)|int %}
        {% set tip_pos  = v.blade_pos|float + v.rip_length|float %}
        {% set after    = nozzle - tip_pos %}
        {% set blade_d  = nozzle - v.blade_pos|float %}
        {% set sensors  = params.SENSORS|default(1)|int %}
        {% set given    = 'TIP' in params %}
        {% set axis     = v.cutting_axis|lower %}
        {% set esp      = v.extruder_move_speed * 60 %}

        {% set pin_x  = v.pin_loc_xy[0]|float %}
        {% set pin_y  = v.pin_loc_xy[1]|float %}
        {% set comp_x = v.pin_loc_compressed_xy[0]|float %}
        {% set comp_y = v.pin_loc_compressed_xy[1]|float %}
        {% set park_x = pin_x + (v.pin_park_dist|float if axis == 'x' else 0.0) %}
        {% set park_y = pin_y + (v.pin_park_dist|float if axis == 'y' else 0.0) %}
        {% set fast_x = park_x + (comp_x - park_x) * v.cut_fast_move_fraction|float %}
        {% set fast_y = park_y + (comp_y - park_y) * v.cut_fast_move_fraction|float %}

        {% set z_safe = [printer.gcode_move.gcode_position.z + v.cut_z_hop|float,
                         printer.toolhead.axis_maximum.z|float]|min %}

        {% if sensors %}
            _FILAMENT_SENSORS ENABLE=0
        {% endif %}

        {% if tip_at >= v.blade_pos|float %}
            { action_raise_error("CUT_FILAMENT: tip is already %.1fmm in, above the blade at %.1fmm. Nothing to cut."
                                 % (depth, blade_d)) }
        {% endif %}
        {% if not given and not st.tip_known|int %}
            RESPOND TYPE=error MSG="Tip position unknown, assuming it is at the nozzle. Pass TIP= if you know where it is."
        {% endif %}
        RESPOND MSG="Cutting: tip {depth|round(1)}mm in, blade {blade_d|round(1)}mm in. Retracting {retract|round(1)}mm to put the tip {(nozzle - target)|round(1)}mm in."

        SAVE_GCODE_STATE NAME=_CUT_FILAMENT

        M83
        {% if retract > 0 %}
            G1 E-{retract} F{esp}
            {% if v.simple_tip_forming %}
                G1 E{retract / 2} F{esp}
                G1 E-{retract / 2} F{esp}
            {% endif %}
        {% endif %}

        G90
        {% if 'z' in printer.toolhead.homed_axes %}
            G1 Z{z_safe} F900
        {% endif %}
        {% if axis == 'y' %}
            G1 Y{park_y} F{v.travel_speed * 60}
            G1 X{park_x} F{v.travel_speed * 60}
        {% else %}
            G1 X{park_x} F{v.travel_speed * 60}
            G1 Y{park_y} F{v.travel_speed * 60}
        {% endif %}

        {% if v.cut_stepper_current|int != 100 %}
            {% for s in v.cut_axis_steppers.split(',') %}
                {% set stp = s.strip() %}
                {% set base = printer.configfile.settings[v.cut_stepper_driver ~ ' ' ~ stp].run_current|float %}
                SET_TMC_CURRENT STEPPER={stp} CURRENT={(base * v.cut_stepper_current|float / 100.0)|round(3)}
            {% endfor %}
        {% endif %}

        G1 X{fast_x} Y{fast_y} F{v.cut_fast_move_speed * 60}
        G1 X{comp_x} Y{comp_y} F{v.cut_slow_move_speed * 60}
        {% if v.cut_dwell_time|float > 0 %}
            G4 P{v.cut_dwell_time}
        {% endif %}

        {% if v.rip_length|float > 0 %}
            G1 E-{v.rip_length} F{v.rip_speed * 60}
        {% endif %}
        G1 X{park_x} Y{park_y} F{v.evacuate_speed * 60}

        {% if v.cut_stepper_current|int != 100 %}
            {% for s in v.cut_axis_steppers.split(',') %}
                {% set stp = s.strip() %}
                SET_TMC_CURRENT STEPPER={stp} CURRENT={printer.configfile.settings[v.cut_stepper_driver ~ ' ' ~ stp].run_current}
            {% endfor %}
        {% endif %}

        {% if pushback %}
            {% set push = [v.pushback_length|float, target]|min %}
            {% if push > 0 %}
                G1 E{push} F{esp}
                {% if v.pushback_dwell_time|float > 0 %}
                    G4 P{v.pushback_dwell_time}
                {% endif %}
                G1 E-{push} F{esp}
            {% endif %}
        {% endif %}

        M400
        RESTORE_GCODE_STATE NAME=_CUT_FILAMENT MOVE=0
        SET_TIP_DEPTH DEPTH={after}

        {% if sensors %}
            _FILAMENT_SENSORS RESTORE=1
        {% endif %}

        RESPOND MSG="Filament cut at {blade_d|round(1)}mm in. Tip now {after|round(1)}mm in, {(nozzle - after)|round(1)}mm short of the nozzle."
    {% endif %}


[gcode_macro TEST_CUT_APPROACH]
description: Move to the cutter approach position without cutting. No filament movement.
gcode:
    {% set v = printer['gcode_macro _CUTTER_VARS'] %}
    {% if 'xy' not in printer.toolhead.homed_axes %}
        { action_raise_error("TEST_CUT_APPROACH: home X and Y first") }
    {% else %}
        {% set pin_x = v.pin_loc_xy[0]|float %}
        {% set pin_y = v.pin_loc_xy[1]|float %}
        {% set park_y = pin_y + v.pin_park_dist|float %}
        {% set comp_y = v.pin_loc_compressed_xy[1]|float %}
        G90
        G1 Y{park_y} F{v.travel_speed * 60}
        G1 X{pin_x} F{v.travel_speed * 60}
        RESPOND MSG="At approach X{pin_x|round(1)} Y{park_y|round(1)}. Pin contact Y{pin_y|round(1)}, full compression Y{comp_y|round(1)}. Run TEST_CUT_STROKE when you are watching."
    {% endif %}


[gcode_macro TEST_CUT_STROKE]
description: Drive the cutter compression stroke slowly, then retreat. Params: SPEED
gcode:
    {% set v = printer['gcode_macro _CUTTER_VARS'] %}
    {% if 'xy' not in printer.toolhead.homed_axes %}
        { action_raise_error("TEST_CUT_STROKE: home X and Y first") }
    {% else %}
        {% set speed = params.SPEED|default(v.cut_slow_move_speed)|float %}
        {% set pin_x = v.pin_loc_xy[0]|float %}
        {% set pin_y = v.pin_loc_xy[1]|float %}
        {% set park_y = pin_y + v.pin_park_dist|float %}
        {% set comp_x = v.pin_loc_compressed_xy[0]|float %}
        {% set comp_y = v.pin_loc_compressed_xy[1]|float %}
        G90
        RESPOND MSG="Compressing to X{comp_x|round(1)} Y{comp_y|round(1)} at {speed|round(1)}mm/s."
        G1 X{comp_x} Y{comp_y} F{speed * 60}
        {% if v.cut_dwell_time|float > 0 %}
            G4 P{v.cut_dwell_time}
        {% endif %}
        G1 X{pin_x} Y{park_y} F{v.evacuate_speed * 60}
        RESPOND MSG="Stroke done, retreated to X{pin_x|round(1)} Y{park_y|round(1)}."
    {% endif %}
