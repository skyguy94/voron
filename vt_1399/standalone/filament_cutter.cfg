#####################################################################
#   Toolhead filament cutter (standalone mode)
#####################################################################
# Geometry copied from [_MMU_CUT_TIP_VARS] in mmu/base/mmu_macro_vars.cfg.
# Keep the two in sync. The cutter is toolhead motion against a frame-mounted
# pin, so it needs no MMU MCU.

[gcode_macro _CUTTER_VARS]
description: Toolhead cutter geometry and speeds for standalone mode
gcode: # Leave empty

variable_enabled                : True		; False to make CUT_FILAMENT a no-op

# Geometry. Distances are measured along the filament path from the
# internal nozzle tip, so blade_pos is where the cut lands.
variable_blade_pos              : 69		; Distance in mm from internal nozzle tip to the blade
variable_retract_length         : 64		; Retract before cutting. Must be less than blade_pos
variable_simple_tip_forming     : True		; Extra in/out move after retract to cool the tip

# Cut motion. cutting_axis is the axis the cut is made along; pin_park_dist
# is applied to that axis to give the blade a short run-up.
variable_cutting_axis           : "y"
variable_pin_loc_xy             : 0, 292	; Toolhead position where the cutter arm just touches the pin
variable_pin_park_dist          : -5.0		; Run-up offset applied along cutting_axis
variable_pin_loc_compressed_xy  : 0, 305	; Toolhead position with the cutter fully compressed
variable_safe_margin_xy         : 30, 30	; Approx toolhead footprint, used to plan a safe approach

# Retract a little after the cut so the blade does not bind on the way back
variable_rip_length             : 1.0
variable_rip_speed              : 3		; mm/s

# Push the severed fragment down past the PTFE/metal junction so it cannot
# foul the next load, then return the filament to where it was.
variable_pushback_length        : 25.0		; PTFE tube length + 3mm is a good start
variable_pushback_dwell_time    : 0		; ms

# Speeds
variable_travel_speed           : 150		; mm/s
variable_cut_fast_move_speed    : 32		; mm/s
variable_cut_slow_move_speed    : 8		; mm/s
variable_evacuate_speed         : 150		; mm/s
variable_extruder_move_speed    : 25		; mm/s
variable_cut_dwell_time         : 50		; ms
variable_cut_fast_move_fraction : 1.0		; Fraction of the run-up done at fast speed
variable_cut_z_hop              : 2.0		; mm of Z clearance taken before travelling to the pin

# Optional stepper current boost for the cut motion. 100 disables it.
variable_cut_axis_steppers      : 'stepper_x, stepper_y'
variable_cut_stepper_driver     : 'tmc5160'	; Driver section prefix for the steppers listed above
variable_cut_stepper_current    : 100		; % of configured run_current


[gcode_macro CUT_FILAMENT]
description: Cut the filament at the toolhead cutter. Params: RETRACT=<mm> PUSHBACK=<0|1>
gcode:
    {% set v = printer['gcode_macro _CUTTER_VARS'] %}
    {% set e = printer[printer.toolhead.extruder] %}

    {% if not v.enabled %}
        { action_respond_info("CUT_FILAMENT: cutter disabled in _CUTTER_VARS, skipping") }
    {% elif 'xyz' not in printer.toolhead.homed_axes %}
        { action_raise_error("CUT_FILAMENT: printer must be homed first") }
    {% elif not e.can_extrude %}
        { action_raise_error("CUT_FILAMENT: extruder is below min_extrude_temp") }
    {% else %}
        {% set retract  = params.RETRACT|default(v.retract_length)|float %}
        {% set pushback = params.PUSHBACK|default(1)|int %}
        {% set axis     = v.cutting_axis|lower %}
        {% set esp      = v.extruder_move_speed * 60 %}

        {% set pin_x  = v.pin_loc_xy[0]|float %}
        {% set pin_y  = v.pin_loc_xy[1]|float %}
        {% set comp_x = v.pin_loc_compressed_xy[0]|float %}
        {% set comp_y = v.pin_loc_compressed_xy[1]|float %}
        {% set park_x = pin_x + (v.pin_park_dist|float if axis == 'x' else 0.0) %}
        {% set park_y = pin_y + (v.pin_park_dist|float if axis == 'y' else 0.0) %}
        {% set fast_x = park_x + (pin_x - park_x) * v.cut_fast_move_fraction|float %}
        {% set fast_y = park_y + (pin_y - park_y) * v.cut_fast_move_fraction|float %}

        {% set z_safe = [printer.toolhead.position.z + v.cut_z_hop|float,
                         printer.toolhead.axis_maximum.z|float]|min %}

        SAVE_GCODE_STATE NAME=_CUT_FILAMENT

        M83
        G1 E-{retract} F{esp}
        {% if v.simple_tip_forming %}
            G1 E{retract / 2} F{esp}
            G1 E-{retract / 2} F{esp}
        {% endif %}

        # Approach along the cut axis so the arm never sweeps sideways into the pin
        G90
        G1 Z{z_safe} F900
        {% if axis == 'y' %}
            {% set clear_y = [park_y - v.safe_margin_xy[1]|float,
                              printer.toolhead.axis_minimum.y|float]|max %}
            {% if printer.toolhead.position.y > clear_y %}
                G1 Y{clear_y} F{v.travel_speed * 60}
            {% endif %}
            G1 X{park_x} F{v.travel_speed * 60}
            G1 Y{park_y} F{v.travel_speed * 60}
        {% else %}
            {% set clear_x = [park_x - v.safe_margin_xy[0]|float,
                              printer.toolhead.axis_minimum.x|float]|max %}
            {% if printer.toolhead.position.x > clear_x %}
                G1 X{clear_x} F{v.travel_speed * 60}
            {% endif %}
            G1 Y{park_y} F{v.travel_speed * 60}
            G1 X{park_x} F{v.travel_speed * 60}
        {% endif %}

        {% if v.cut_stepper_current|int != 100 %}
            {% for s in v.cut_axis_steppers.split(',') %}
                {% set st = s.strip() %}
                {% set base = printer.configfile.settings[v.cut_stepper_driver ~ ' ' ~ st].run_current|float %}
                SET_TMC_CURRENT STEPPER={st} CURRENT={(base * v.cut_stepper_current|float / 100.0)|round(3)}
            {% endfor %}
        {% endif %}

        G1 X{fast_x} Y{fast_y} F{v.cut_fast_move_speed * 60}
        G1 X{comp_x} Y{comp_y} F{v.cut_slow_move_speed * 60}
        {% if v.cut_dwell_time|float > 0 %}
            G4 P{v.cut_dwell_time}
        {% endif %}

        {% if v.rip_length|float > 0 %}
            G1 E-{v.rip_length} F{v.rip_speed * 60}
        {% endif %}
        G1 X{park_x} Y{park_y} F{v.evacuate_speed * 60}

        {% if v.cut_stepper_current|int != 100 %}
            {% for s in v.cut_axis_steppers.split(',') %}
                {% set st = s.strip() %}
                SET_TMC_CURRENT STEPPER={st} CURRENT={printer.configfile.settings[v.cut_stepper_driver ~ ' ' ~ st].run_current}
            {% endfor %}
        {% endif %}

        {% if pushback and v.pushback_length|float > 0 %}
            G1 E{v.pushback_length} F{esp}
            {% if v.pushback_dwell_time|float > 0 %}
                G4 P{v.pushback_dwell_time}
            {% endif %}
            G1 E-{v.pushback_length} F{esp}
        {% endif %}

        # Stays parked at the pin; the caller decides where to go next
        RESTORE_GCODE_STATE NAME=_CUT_FILAMENT MOVE=0

        { action_respond_info("Filament cut. Tip is now ~%.1fmm from the nozzle."
                              % (v.blade_pos|float + v.rip_length|float)) }
    {% endif %}
