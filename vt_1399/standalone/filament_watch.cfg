[gcode_macro _FILAMENT_WATCH_VARS]
description: Settings for the filament switch monitor
gcode: # Leave empty

variable_interval                : 0.5


[gcode_macro _FILAMENT_LOG]
description: Write one filament event to klippy.log and the console. Params: CODE LVL MSG E H
gcode:
    {% set es = printer['filament_switch_sensor fil_entry'] %}
    {% set ts = printer['filament_switch_sensor fil_toolhead'] %}
    {% set e = params.E|default(1 if es.filament_detected else 0)|int %}
    {% set h = params.H|default(1 if ts.filament_detected else 0)|int %}
    {% set lvl = params.LVL|default('info')|string %}
    {% set code = params.CODE|string %}
    {% set msg = params.MSG|string %}
    {% set arm = "%d%d" % (1 if es.enabled else 0, 1 if ts.enabled else 0) %}
    {% set pair = 'break' if (h and not e) else 'ok' %}
    {% set t = printer.toolhead.estimated_print_time|float %}

    { action_respond_info("FILAMENT lvl=%s code=%s entry=%d head=%d pair=%s armed=%s job=%s t=%.2f :: %s"
        % (lvl, code, e, h, pair, arm, printer.print_stats.state, t, msg)) }
    {% if lvl != 'info' %}
        RESPOND TYPE=error MSG="{msg}"
    {% endif %}


[gcode_macro _FILAMENT_WATCH]
description: Compare both filament switches against their last seen state and log every change
variable_started                : 0
variable_entry                  : 0
variable_head                   : 0
variable_arm                    : 0
gcode:
    {% set w = printer['gcode_macro _FILAMENT_WATCH'] %}
    {% set v = printer['gcode_macro _FILAMENT_VARS'] %}
    {% set es = printer['filament_switch_sensor fil_entry'] %}
    {% set ts = printer['filament_switch_sensor fil_toolhead'] %}
    {% set e = 1 if es.filament_detected else 0 %}
    {% set h = 1 if ts.filament_detected else 0 %}
    {% set a = (2 if es.enabled else 0) + (1 if ts.enabled else 0) %}
    {% set printing = printer.print_stats.state == 'printing' %}
    {% set left = v.sensor_to_nozzle|float %}

    {% if not w.started|int %}
        _FILAMENT_LOG CODE=watch_start LVL=info E={e} H={h} MSG="Filament monitoring started."
        SET_GCODE_VARIABLE MACRO=_FILAMENT_WATCH VARIABLE=started VALUE=1
    {% else %}
        {% if a != w.arm|int %}
            _FILAMENT_LOG CODE=arming LVL=info E={e} H={h} MSG="Runout response is now {'on for both switches' if a == 3 else ('off for both switches' if a == 0 else 'on for one switch only')}."
        {% endif %}

        {% if e != w.entry|int %}
            {% if e %}
                _FILAMENT_LOG CODE=entry_filled LVL={'warn' if printing else 'info'} E={e} H={h} MSG="{'Filament came back at the toolhead inlet in the middle of a print. That cannot happen on its own, so the inlet switch is suspect.' if printing else 'Filament reached the toolhead inlet.'}"
            {% else %}
                _FILAMENT_LOG CODE={'runout' if printing else 'entry_cleared'} LVL={'alarm' if printing else 'info'} E={e} H={h} MSG="{'Out of filament. Nothing is feeding into the toolhead any more.' if printing else 'Filament pulled back out of the toolhead inlet.'}"
            {% endif %}
        {% endif %}

        {% if h != w.head|int %}
            {% if h %}
                _FILAMENT_LOG CODE=head_filled LVL={'warn' if printing else 'info'} E={e} H={h} MSG="{'Filament came back at the toolhead sensor in the middle of a print, so it had briefly gone missing. The toolhead switch is suspect.' if printing else 'Filament reached the toolhead sensor.'}"
            {% else %}
                _FILAMENT_LOG CODE={'starving' if printing else 'head_cleared'} LVL={'alarm' if printing else 'info'} E={e} H={h} MSG="{('The end of the filament has passed the toolhead sensor. Roughly %.0fmm of feed is left before the nozzle runs dry.' % left) if printing else 'Filament pulled back above the toolhead sensor.'}"
            {% endif %}
        {% endif %}

        {% if (h and not e) and not (w.head|int and not w.entry|int) %}
            _FILAMENT_LOG CODE=break LVL=warn E={e} H={h} MSG="The toolhead sensor sees filament but the inlet does not. Either the strand is broken between the two, or one of the two switches is stuck."
        {% endif %}
    {% endif %}

    SET_GCODE_VARIABLE MACRO=_FILAMENT_WATCH VARIABLE=entry VALUE={e}
    SET_GCODE_VARIABLE MACRO=_FILAMENT_WATCH VARIABLE=head VALUE={h}
    SET_GCODE_VARIABLE MACRO=_FILAMENT_WATCH VARIABLE=arm VALUE={a}


[delayed_gcode _FILAMENT_WATCH_TICK]
initial_duration: 2.0
gcode:
    _FILAMENT_WATCH
    UPDATE_DELAYED_GCODE ID=_FILAMENT_WATCH_TICK DURATION={printer['gcode_macro _FILAMENT_WATCH_VARS'].interval}
