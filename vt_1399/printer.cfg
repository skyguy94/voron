[include mcu.leviathan.1_2.cfg]
[include toolhead.h36.1_3.cfg]
[include macros/*.cfg]
[include mode_standalone.cfg]
#[include mode_mmu.cfg]

[exclude_object]
[pause_resume]
[skew_correction]
[respond]
[shaketune]

[virtual_sdcard]
path: ~/printer_data/gcodes
#on_error_gcode: CANCEL_PRINT

[printer]
kinematics: corexy
max_velocity: 500
max_accel: 20000
max_z_velocity: 50
max_z_accel: 500
square_corner_velocity: 5.0

#####################################################################
#      X/Y Stepper Settings
#####################################################################

[stepper_x]
##	Connected to X-MOT (B Motor)
step_pin: X_STEP
dir_pin: !X_DIR
enable_pin: !X_EN
rotation_distance: 40
microsteps: 32
full_steps_per_rotation: 400
position_min: 0
position_endstop: 300
position_max: 300
homing_speed: 100
endstop_pin: toolhead:LIMIT0_1		# H36 IO.1: level-shifted input with a hardware pull-up, so no ^

[tmc5160 stepper_x]
cs_pin: X_CS
spi_bus: spi4
interpolate: false
run_current: 0.8
sense_resistor: 0.075
stealthchop_threshold: 0

[stepper_y]
##	Connected to Y-MOT (A Motor)
step_pin: Y_STEP
dir_pin: !Y_DIR
enable_pin: !Y_EN
rotation_distance: 40
microsteps: 32
full_steps_per_rotation: 400
endstop_pin: ^Y_MIN
position_min: 0
position_endstop: 307
position_max: 307
homing_speed: 100

[tmc5160 stepper_y]
cs_pin: Y_CS
spi_bus: spi4
interpolate: false
run_current: 0.8
sense_resistor: 0.075
stealthchop_threshold: 0

#####################################################################
#   Z Stepper Settings
#####################################################################
#  Z0 Stepper - Front Left
[stepper_z]
step_pin: Z_STEP
dir_pin: Z_DIR
enable_pin: !Z_EN
rotation_distance: 4
full_steps_per_rotation: 200
microsteps: 32
endstop_pin: probe:z_virtual_endstop
position_max: 230
position_min: -0.9
homing_speed: 8
second_homing_speed: 3
homing_retract_dist: 0

[tmc2209 stepper_z]
uart_pin: Z_CS
interpolate: false
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0

## Z1 Stepper - Rear
[stepper_z1]
step_pin: Z1_STEP
dir_pin: Z1_DIR
enable_pin: !Z1_EN
rotation_distance: 4
full_steps_per_rotation: 200
microsteps: 32

[tmc2209 stepper_z1]
uart_pin: Z1_CS
interpolate: false
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0

## Z2 Stepper - Front Right
[stepper_z2]
step_pin: Z2_STEP
dir_pin: Z2_DIR
enable_pin: !Z2_EN
rotation_distance: 4
full_steps_per_rotation: 200
microsteps: 32

[tmc2209 stepper_z2]
uart_pin: Z2_CS
interpolate: false
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0

#####################################################################
#   Extruder Settings
#####################################################################

[extruder]
step_pin: toolhead:EXT_STEP
dir_pin: toolhead:EXT_DIR
enable_pin: !toolhead:EXT_EN
rotation_distance: 46.000
gear_ratio: 9:1
microsteps: 16
full_steps_per_rotation: 200
max_extrude_only_velocity: 50.0
max_extrude_only_accel: 1500
nozzle_diameter: 0.400
filament_diameter: 1.750
max_extrude_only_distance: 200
pressure_advance: 0.04
pressure_advance_smooth_time: 0.040
heater_pin: toolhead:HE0
sensor_type: PT1000
sensor_pin: toolhead:TH0
pullup_resistor: 2200
min_temp: 0
max_temp: 350
min_extrude_temp: 148

[tmc2209 extruder]
uart_pin: toolhead:EXT_UART
stealthchop_threshold: 0
run_current: 0.60

[firmware_retraction]
retract_length: 0.8
retract_speed: 60
unretract_speed: 30

[heater_fan hotend_fan]
pin: toolhead:FAN0
tachometer_pin:^toolhead:TACH0
tachometer_poll_interval: 0.001
heater: extruder

[multi_pin part_fans]
pins: toolhead:FAN2, toolhead:FAN3

[fan]
pin: multi_pin:part_fans
kick_start_time: 0.25
cycle_time: 0.15
off_below: 0.10

#####################################################################
#   Probe
#####################################################################

[mcu cartographer]
canbus_uuid: 188bd997d90d

[cartographer]
mcu: cartographer
x_offset: 0
y_offset: 16
verbose: yes

#####################################################################
#   Chamber Control
#####################################################################

[heater_bed]
heater_pin: HOTEND
sensor_type: Generic 3950 #[RMEL] Keenovo says its a NTC 100K and the klipper docs say to use this.
sensor_pin: TH0
pullup_resistor: 2200
min_temp: 0
max_temp: 125

[heater_generic chamber_heater]
heater_pin: HEATER_BED
sensor_type: Generic 3950
sensor_pin: TH1
pullup_resistor: 2200
control: watermark
max_delta: 2.0
max_power: 1.0
min_temp: 0
max_temp: 85
gcode_id: C

[verify_heater chamber_heater]
max_error: 20000
check_gain_time: 300
hysteresis: 25
heating_gain: 1

[temperature_sensor chamber_core]
sensor_type: ATC Semitec 104NT-4-R025H42G
sensor_pin: TH2
pullup_resistor: 2200
min_temp: 0
max_temp: 105

[heater_fan chamber_blower]
pin: FAN2
heater: chamber_heater
heater_temp: 40

#####################################################################
#	Voltage Monitor
#####################################################################

[adc_temperature 5V_Monitor]
temperature1: 5
voltage1: 3.0
temperature2: 4
voltage2: 2.4
temperature3: 3
voltage3: 1.8

[adc_temperature 24V_Monitor]
temperature1: 24
voltage1: 3.13
temperature2: 22
voltage2: 2.87
temperature3: 21
voltage3: 2.74

[temperature_sensor toolhead_5V]
sensor_type: 5V_Monitor
sensor_pin: toolhead:V5_MON
adc_voltage: 3.3
voltage_offset: 0

[temperature_sensor toolhead_24V]
sensor_type: 24V_Monitor
sensor_pin: toolhead:V24_MON
adc_voltage: 3.3
voltage_offset: 0

#####################################################################
#	Electronics Fans
#####################################################################

[multi_pin mcu_fans]
pins: FAN0, FAN1

[temperature_fan mcu_fan]
pin: multi_pin:mcu_fans
sensor_type: temperature_mcu
control: watermark
max_power: 0.4
shutdown_speed: 0.0
min_temp: 10
max_temp: 80
target_temp: 40

[temperature_sensor raspberry_pi]
sensor_type: temperature_host
min_temp: 10
max_temp: 100

[temperature_sensor H36]
sensor_type: Generic 3950
sensor_pin: toolhead:TH1
min_temp:0
max_temp:150

[nevermore]
bt_address: 28:CD:C1:0D:0B:2E
fan_power_coefficient: 0.75

#####################################################################
#	LED Control
#####################################################################

[led chamber]
white_pin: LED_STRIP
initial_WHITE: 1.0

[neopixel sb_leds]
pin: toolhead:RGBLED
chain_count: 3
color_order: GRB, GRB, GRB
initial_RED: 0.0
initial_GREEN: 1.0
initial_BLUE: 1.0
initial_WHITE: 0.0

# Set RGB values on boot up for each Neopixel.
# Index 1 = display, Index 2 and 3 = Knob
[delayed_gcode setdisplayneopixel]
initial_duration: 1
gcode:
   SET_LED LED=fysetc_mini12864 RED=1 GREEN=1 BLUE=1 INDEX=1 TRANSMIT=0
   SET_LED LED=fysetc_mini12864 RED=1 GREEN=0 BLUE=0 INDEX=2 TRANSMIT=0
   SET_LED LED=fysetc_mini12864 RED=1 GREEN=0 BLUE=0 INDEX=3

#####################################################################
#	Homing and Gantry Adjustment Routines
#####################################################################

[idle_timeout]
timeout: 3600
gcode:
    {% if printer.pause_resume.is_paused %}
        RESPOND TYPE=error MSG="Idle timeout while paused: hotend off, steppers left enabled to hold position"
        SET_HEATER_TEMPERATURE HEATER=extruder TARGET=0
    {% else %}
        TURN_OFF_HEATERS
        M84
    {% endif %}

[force_move]
enable_force_move: True

[safe_z_home]
home_xy_position: 150, 150
speed: 100
z_hop: 1.5

[z_tilt]
z_positions:
   7.7, 17.2
   150, 277.6
   292.3, 17.2
points:
   30, 5
   150, 245
   270, 10
speed: 200
horizontal_move_z: 10
retries: 9
retry_tolerance: 0.0075

[bed_mesh]
zero_reference_position: 150,150
speed: 300
horizontal_move_z: 3
mesh_min: 30, 20
mesh_max: 270,265
probe_count: 20,20
mesh_pps: 0,0

#####################################################################
#	Displays
#####################################################################

# mini12864 LCD Display
[display]
lcd_type: uc1701
cs_pin: LCD_EN
a0_pin: LCD_RS
rst_pin: LCD_D4
encoder_pins: ^BTN_EN1,^BTN_EN2
click_pin: ^!BTN_ENC
contrast: 63
spi_software_mosi_pin: SPI_MOSI
spi_software_miso_pin: SPI_MISO
spi_software_sclk_pin: SPI_SCK

[neopixel fysetc_mini12864]
pin: LCD_D5
chain_count: 3
initial_RED: 0.1
initial_GREEN: 0.5
initial_BLUE: 0.0
color_order: RGB

#####################################################################
#	Display Menu
#####################################################################

[menu __main __tune]
type: disabled

[menu __main __octoprint]
type: disabled

[menu __main __sdcard]
type: disabled

### print ###
[menu __main __print]
type: list
enable: {printer.print_stats.state in ("printing", "paused")}
name: Print
index: 0

[menu __main __print __pause]
type: command
enable: {printer.print_stats.state == "printing"}
name: Pause
gcode: PAUSE

[menu __main __print __resume]
type: command
enable: {printer.print_stats.state == "paused"}
name: Resume
gcode: RESUME

[menu __main __print __cancel]
type: list
enable: {printer.print_stats.state in ("printing", "paused")}
name: Cancel print

[menu __main __print __cancel __confirm]
type: command
name: Yes, cancel
gcode: CANCEL_PRINT

### control ###
[menu __main __control __clean_nozzle]
type: command
enable: {printer.print_stats.state not in ("printing", "paused") and printer.idle_timeout.state != "Printing"}
name: Clean Nozzle
index: 4
gcode: CLEAN_NOZZLE

[menu __main __control __probe]
type: command
enable: {printer.print_stats.state not in ("printing", "paused")
         and printer.idle_timeout.state != "Printing"
         and 'probe' in printer and 'xyz' in printer.toolhead.homed_axes}
name: Bed probe
index: 6
gcode: PROBE

[menu __main __control __disable]
type: command
enable: {printer.print_stats.state not in ("printing", "paused") and printer.idle_timeout.state != "Printing"}
name: Steppers off
gcode: M84

[menu __main __control __home]
type: command
enable: {printer.print_stats.state not in ("printing", "paused") and printer.idle_timeout.state != "Printing"}
name: Home All
gcode: G28

[menu __main __control __homez]
type: command
enable: {printer.print_stats.state not in ("printing", "paused") and printer.idle_timeout.state != "Printing"}
name: Home Z
gcode: G28 Z

[menu __main __control __homexy]
type: command
enable: {printer.print_stats.state not in ("printing", "paused") and printer.idle_timeout.state != "Printing"}
name: Home X/Y
gcode: G28 X Y

[menu __main __control __z_tilt]
type: command
enable: {printer.print_stats.state not in ("printing", "paused")
         and printer.idle_timeout.state != "Printing" and 'z_tilt' in printer}
name: Z Tilt
gcode: Z_TILT_ADJUST

[menu __main __control __bed_mesh]
type: command
enable: {printer.print_stats.state not in ("printing", "paused")
         and printer.idle_timeout.state != "Printing" and 'bed_mesh' in printer}
name: Bed Mesh
gcode: BED_MESH_CALIBRATE

[menu __main __control __move_10mm]
type: list
enable: {printer.print_stats.state not in ("printing", "paused") and printer.idle_timeout.state != "Printing"}
name: Move 10mm

[menu __main __control __move_1mm]
type: list
enable: {printer.print_stats.state not in ("printing", "paused") and printer.idle_timeout.state != "Printing"}
name: Move 1mm

[menu __main __control __move_01mm]
type: list
enable: {printer.print_stats.state not in ("printing", "paused") and printer.idle_timeout.state != "Printing"}
name: Move 0.1mm

[menu __main __control __caselightonoff]
type: disabled

[menu __main __control __caselightpwm]
type: disabled

[menu __main __control __restart]
type: list
enable: {printer.print_stats.state not in ("printing", "paused") and printer.idle_timeout.state != "Printing"}
name: Restart

[menu __main __control __restart __host]
type: command
name: Restart host
gcode: RESTART

[menu __main __control __restart __firmware]
type: command
name: Restart FW
gcode: FIRMWARE_RESTART

[menu __main __control __chamberlight]
type: input
enable: {'led chamber' in printer}
name: Light: {'ON ' if menu.input else 'OFF'}
input: {printer['led chamber'].color_data[0][3]}
input_min: 0
input_max: 1
input_step: 1
index: 11
gcode: SET_LED LED=chamber WHITE={1 if menu.input else 0}

### temperature ###
[menu __main __temp __chamber_target]
type: input
enable: {'heater_generic chamber_heater' in printer}
name: {"Chm:%3.0f (%4.0f)" % (menu.input, printer['heater_generic chamber_heater'].temperature)}
input: {printer['heater_generic chamber_heater'].target}
input_min: 0
input_max: 70
input_step: 5
index: 3
gcode: SET_HEATER_TEMPERATURE HEATER=chamber_heater TARGET={'%.0f' % menu.input}

[menu __main __temp __preheat_pla]
type: disabled

[menu __main __temp __preheat_abs]
type: list
enable: {printer.print_stats.state not in ("printing", "paused")
         and printer.idle_timeout.state != "Printing"}
name: Preheat ABS

[menu __main __temp __preheat_abs __all]
type: command
name: Preheat all
gcode:
    M140 S120
    M104 S250
    SET_HEATER_TEMPERATURE HEATER=chamber_heater TARGET=65
    _SOAK_POSITION

[menu __main __temp __preheat_abs __hotbed]
type: command
enable: {'heater_bed' in printer}
name: Preheat hotbed
gcode: M140 S120

[menu __main __temp __preheat_abs __hotend]
type: command
enable: {'extruder' in printer}
name: Preheat hotend
gcode: M104 S250

[menu __main __temp __cooldown __all]
type: command
name: Cooldown all
gcode: TURN_OFF_HEATERS

[menu __main __temp __cooldown __chamber]
type: command
enable: {'heater_generic chamber_heater' in printer}
name: Chamber off
gcode: SET_HEATER_TEMPERATURE HEATER=chamber_heater TARGET=0

### filament ###
[menu __main __filament __unloadf]
type: command
enable: {printer.print_stats.state not in ("printing", "paused") and printer.idle_timeout.state != "Printing"}
name: Unload (cut)
gcode: UNLOAD_FILAMENT CUT={1 if 'xyz' in printer.toolhead.homed_axes else 0}

[menu __main __filament __unloads]
type: command
enable: {printer.print_stats.state not in ("printing", "paused") and printer.idle_timeout.state != "Printing"}
name: Unload to park
gcode: UNLOAD_FILAMENT PARK=1 CUT={1 if 'xyz' in printer.toolhead.homed_axes else 0}

[menu __main __filament __loadf]
type: command
enable: {printer.print_stats.state not in ("printing", "paused") and printer.idle_timeout.state != "Printing"}
name: Load Filament
gcode: LOAD_FILAMENT

[menu __main __filament __feed]
type: input
enable: {printer.print_stats.state not in ("printing", "paused") and printer.idle_timeout.state != "Printing"}
name: Feed: {'%.1f' % menu.input}
input: 5
input_step: 0.1
gcode:
    SAVE_GCODE_STATE NAME=__filament__load
    M83
    G1 E{'%.1f' % menu.input} F60
    RESTORE_GCODE_STATE NAME=__filament__load

[menu __main __filament __loads]
type: disabled

### setup ###
[menu __main __setup]
type: disabled

#####################################################################
#	Accelerometer
#####################################################################

[adxl345]
cs_pin: toolhead:ADXL_CS
spi_software_sclk_pin: toolhead:ADXL_CLK
spi_software_mosi_pin: toolhead:ADXL_MOSI
spi_software_miso_pin: toolhead:ADXL_MISO

[resonance_tester]
accel_chip:adxl345
probe_points:
    150,150,20

