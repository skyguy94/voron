[gcode_macro _PRINT_RETRY]
description: Retry bookkeeping for a PRINT_START that fails before the first extrusion
variable_armed: 0
variable_count: 0
variable_limit: 2
gcode:
    {% set v = printer['gcode_macro _PRINT_RETRY'] %}
    RESPOND MSG="Print retry: armed={v.armed|int}, used {v.count|int} of {v.limit|int}."


[delayed_gcode _PRINT_RETRY_RUN]
gcode:
    CLEAN_NOZZLE TEMP={printer["gcode_macro _CLEAN_NOZZLE_VARS"].soften_temp}
    M24
