[gcode_macro PRINT_START]
gcode:
    {% if printer['gcode_macro _PRINT_RETRY'].armed|int == 0 %}
        SET_GCODE_VARIABLE MACRO=_PRINT_RETRY VARIABLE=count VALUE=0
    {% endif %}
    SET_GCODE_VARIABLE MACRO=_PRINT_RETRY VARIABLE=armed VALUE=1

    EXCLUDE_OBJECT_DEFINE

    {% set cfg = printer.configfile.settings.printer %}
    SET_VELOCITY_LIMIT VELOCITY={cfg.max_velocity} ACCEL={cfg.max_accel} SQUARE_CORNER_VELOCITY={cfg.square_corner_velocity}

    {% set bed = params.BED| default(60) | int %}
    {% set extruder = params.EXTRUDER| default(150) | int %}
    {% set extruder_idle = params.EXTRUDER_IDLE| default(150) | int %}
    {% set cnv = printer["gcode_macro _CLEAN_NOZZLE_VARS"] %}
    {% set material = params.MATERIAL| default('') | upper %}
    {% set extruder_soften = params.EXTRUDER_SOFTEN| default(cnv.soften_map.get(material, cnv.soften_default)) | int %}

    SET_GCODE_VARIABLE MACRO=_CLEAN_NOZZLE_VARS VARIABLE=soften_temp VALUE={ extruder_soften }

    M104 S{ extruder_soften }
    {% if params.CHAMBER is defined %}
        SET_HEATER_TEMPERATURE HEATER=chamber_heater TARGET={ params.CHAMBER | int }
    {% endif %}

    {% if not 'xyz' in printer.toolhead.homed_axes %}
        STATUS_HOMING
        G28
    {% endif %}

    M107

    CLEAN_NOZZLE TEMP={ extruder_soften } RESTORE=0
    M104 S{ extruder_idle }

    M190 S{ bed }

    STATUS_LEVELING
    M117 Z tilt adjust
    Z_TILT_ADJUST
    G28 Z

    M117 Bed mesh calibrate
    STATUS_MESHING
    BED_MESH_CALIBRATE

    M117 Z offset calibrate
    M109 S{ extruder_idle }
    CLEAN_NOZZLE CYCLES=1 SCRUB=2

    CARTOGRAPHER_TOUCH_HOME
    
    M117 Reheating extruder
    STATUS_HEATING
    M109 S{ extruder }

    SKEW_PROFILE LOAD=CaliFlower

    {% set p = printer.configfile.settings.printer %}
    SET_VELOCITY_LIMIT VELOCITY={p.max_velocity} ACCEL={p.max_accel} SQUARE_CORNER_VELOCITY={p.square_corner_velocity}

    SET_GCODE_VARIABLE MACRO=_PRINT_RETRY VARIABLE=armed VALUE=0
    SET_GCODE_VARIABLE MACRO=_PRINT_RETRY VARIABLE=count VALUE=0
    STATUS_PRINTING
