[gcode_macro PRINT_START]
gcode:
    EXCLUDE_OBJECT_DEFINE

    {% set cfg = printer.configfile.settings.printer %}
    SET_VELOCITY_LIMIT VELOCITY={cfg.max_velocity} ACCEL={cfg.max_accel} SQUARE_CORNER_VELOCITY={cfg.square_corner_velocity}

    {% set bed = params.BED| default(60) | int %}
    {% set extruder = params.EXTRUDER| default(150) | int %}
    {% set extruder_idle = params.EXTRUDER_IDLE| default(150) | int %}
    {% set chamber = params.CHAMBER| default(0) | int %}

    M104 S{ extruder_idle }
    SET_HEATER_TEMPERATURE HEATER=chamber_heater TARGET={ chamber }

    {% if not 'xyz' in printer.toolhead.homed_axes %}
        STATUS_HOMING
        G28
    {% endif %}

    M190 S{ bed }

    M107

    CLEAN_NOZZLE

    STATUS_LEVELING
    M117 Z tilt adjust
    Z_TILT_ADJUST
    G28 Z

    M117 Bed mesh calibrate
    STATUS_MESHING
    BED_MESH_CALIBRATE

    M117 Z offset calibrate
    CLEAN_NOZZLE

    M109  S{ extruder_idle }
    CARTOGRAPHER_TOUCH_HOME
    
    M117 Reheating extruder
    STATUS_HEATING
    M109 S{ extruder }

    SKEW_PROFILE LOAD=CaliFlower

    {% set p = printer.configfile.settings.printer %}
    SET_VELOCITY_LIMIT VELOCITY={p.max_velocity} ACCEL={p.max_accel} SQUARE_CORNER_VELOCITY={p.square_corner_velocity}

    STATUS_PRINTING