[gcode_macro _CLEAN_NOZZLE_VARS]
description: Brush geometry and wipe motion for CLEAN_NOZZLE
gcode: # Leave empty

# Travel limits. Wider than the pad.
variable_x_min          : 32.0
variable_x_max          : 86.0

# Pad limits. Measure with CLEAN_NOZZLE_SWEEP and set to the first and
# last X that actually touch.
variable_pad_x_min      : 42.0
variable_pad_x_max      : 76.0

# One Y per lane. Add more to spread wear over the pad.
variable_y_lanes        : [307.0]

variable_cycles         : 3		; crossing + scrub burst pairs
variable_scrub_strokes  : 6		; oscillations per burst
variable_scrub_len      : 9.0		; oscillation stroke, must fit inside the pad
variable_cross_speed    : 12000		; mm/min for full passes, slow enough for the bristles to load
variable_scrub_speed    : 21000		; mm/min for in-pad oscillation
variable_accel          : 20000
variable_settle_ms      : 600		; let the gantry ring down before anything probes
variable_lane_index     : 0

[gcode_macro CLEAN_NOZZLE]
description: Wipe the nozzle. Full-width crossings alternated with fast in-pad scrub bursts. Params: CYCLES SCRUB SETTLE
gcode:
    {% if "xy" not in printer.toolhead.homed_axes %}
        { action_respond_info("CLEAN_NOZZLE skipped, X/Y not homed") }
    {% else %}
        {% set v   = printer["gcode_macro _CLEAN_NOZZLE_VARS"] %}
        {% set cfg = printer.configfile.settings.printer %}

        {% set save_accel = printer.toolhead.max_accel %}
        {% set save_scv   = printer.toolhead.square_corner_velocity %}
        {% set save_mcr   = printer.toolhead.minimum_cruise_ratio %}

        {% set cycles  = params.CYCLES|default(v.cycles)|int %}
        {% set strokes = params.SCRUB|default(v.scrub_strokes)|int %}
        {% set settle  = params.SETTLE|default(v.settle_ms)|int %}

        {% set x_lo = v.x_min|float %}
        {% set x_hi = v.x_max|float %}
        {% set lanes = v.y_lanes %}
        {% set nlanes = lanes|length %}
        {% set lane0 = v.lane_index|int %}

        {% set pad_lo = [v.pad_x_min|float, x_lo]|max %}
        {% set pad_hi = [v.pad_x_max|float, x_hi]|min %}
        {% set slen   = [v.scrub_len|float, (pad_hi - pad_lo) * 0.8]|min %}
        {% set mid    = (pad_lo + pad_hi) / 2.0 %}
        {% set centres = [pad_hi - slen / 2.0, mid, pad_lo + slen / 2.0] %}

        SAVE_GCODE_STATE NAME=CLEAN_NOZZLE
        SET_VELOCITY_LIMIT ACCEL={v.accel} SQUARE_CORNER_VELOCITY={cfg.square_corner_velocity} MINIMUM_CRUISE_RATIO=0

        G92 E0
        M82
        M220 S100
        G90

        G0 X{x_lo} Y{lanes[lane0 % nlanes]} F18000

        {% for c in range(cycles) %}
            G0 Y{lanes[(lane0 + c) % nlanes]} F18000

            G1 X{x_hi} F{v.cross_speed}

            {% set cA = centres[c % 3] %}
            {% for s in range(strokes) %}
                G1 X{cA - slen / 2.0} F{v.scrub_speed}
                G1 X{cA + slen / 2.0} F{v.scrub_speed}
            {% endfor %}

            G1 X{x_lo} F{v.cross_speed}

            {% set cB = centres[(c + 1) % 3] %}
            {% for s in range(strokes) %}
                G1 X{cB + slen / 2.0} F{v.scrub_speed}
                G1 X{cB - slen / 2.0} F{v.scrub_speed}
            {% endfor %}
        {% endfor %}

        G1 X{x_hi} F{v.cross_speed}
        G1 X{x_lo} F{v.cross_speed}

        SET_GCODE_VARIABLE MACRO=_CLEAN_NOZZLE_VARS VARIABLE=lane_index VALUE={ (lane0 + cycles) % nlanes }

        SET_VELOCITY_LIMIT ACCEL={save_accel} SQUARE_CORNER_VELOCITY={save_scv} MINIMUM_CRUISE_RATIO={save_mcr}
        RESTORE_GCODE_STATE NAME=CLEAN_NOZZLE

        {% if settle > 0 %}
            M400
            G4 P{settle}
        {% endif %}
    {% endif %}

[gcode_macro CLEAN_NOZZLE_SWEEP]
description: Step the nozzle along the brush line to find the bristle edges. Params: STEP DWELL Y
gcode:
    {% if "xy" not in printer.toolhead.homed_axes %}
        { action_respond_info("CLEAN_NOZZLE_SWEEP skipped, X/Y not homed") }
    {% else %}
        {% set v     = printer["gcode_macro _CLEAN_NOZZLE_VARS"] %}
        {% set step  = params.STEP|default(2.0)|float %}
        {% set dwell = params.DWELL|default(1200)|int %}
        {% set y     = params.Y|default(v.y_lanes[0])|float %}
        {% set x_lo  = v.x_min|float %}
        {% set steps = ((v.x_max|float - x_lo) / step)|int %}

        SAVE_GCODE_STATE NAME=CLEAN_NOZZLE_SWEEP
        G90
        G0 X{x_lo} Y{y} F18000

        {% for i in range(steps + 1) %}
            {% set x = x_lo + i * step %}
            G0 X{x} F3000
            M400
            RESPOND TYPE=echo MSG="sweep X={ "%.1f"|format(x) } Y={ "%.1f"|format(y) }"
            G4 P{dwell}
        {% endfor %}

        RESTORE_GCODE_STATE NAME=CLEAN_NOZZLE_SWEEP
    {% endif %}
