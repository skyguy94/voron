[gcode_macro CLEAN_NOZZLE]
gcode:
   {% if "xy" in printer.toolhead.homed_axes %}
      # Silent unless the wipe is about to run degraded. Logged with a timestamp
      # in klippy.log so an unattended slow wipe can be traced afterwards.
      {% set gm = printer.gcode_move %}
      {% set th = printer.toolhead %}
      {% set cfg = printer.configfile.settings.printer %}
      {% if gm.speed_factor != 1.0 or th.max_velocity < cfg.max_velocity or th.max_accel < cfg.max_accel %}
         RESPOND TYPE=error MSG="CLEAN_NOZZLE degraded: M220 {(gm.speed_factor * 100)|round(1)}% velocity {th.max_velocity}/{cfg.max_velocity} accel {th.max_accel}/{cfg.max_accel}"
      {% endif %}

      SAVE_GCODE_STATE NAME=CLEAN_NOZZLE

      G92 E0
      M82
      M220 S100

      G91
      #G0 Z5 F5000                                                   # Z hop

      G90
      G0 F18000
      G1 X30 Y307

      {% for wipes in range(1, 4) %}
         G1 X75
         G1 X30
      {% endfor %}
   
      G0 F5000

      RESTORE_GCODE_STATE NAME=CLEAN_NOZZLE
   {% endif %}
 