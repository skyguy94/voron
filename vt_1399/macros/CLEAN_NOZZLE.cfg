[gcode_macro CLEAN_NOZZLE]
gcode:
   {% if "xy" in printer.toolhead.homed_axes %}
      {% set cfg = printer.configfile.settings.printer %}
      {% set save_accel = printer.toolhead.max_accel %}
      {% set save_scv = printer.toolhead.square_corner_velocity %}

      SAVE_GCODE_STATE NAME=CLEAN_NOZZLE

      SET_VELOCITY_LIMIT ACCEL={cfg.max_accel} SQUARE_CORNER_VELOCITY={cfg.square_corner_velocity}

      G92 E0
      M82
      M220 S100

      G91
      #G0 Z5 F5000                                                   # Z hop

      G90
      G0 F18000
      G1 X30 Y307

      {% for wipes in range(1, 4) %}
         G1 X75
         G1 X30
      {% endfor %}
   
      G0 F5000

      SET_VELOCITY_LIMIT ACCEL={save_accel} SQUARE_CORNER_VELOCITY={save_scv}
      RESTORE_GCODE_STATE NAME=CLEAN_NOZZLE
   {% endif %}
 