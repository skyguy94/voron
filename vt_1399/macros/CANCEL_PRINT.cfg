[gcode_macro CANCEL_PRINT]
rename_existing: BUILTIN_CANCEL_PRINT
description: Cancel print
gcode:
    {% set e   = params.E|default(1.5)|float %}
    {% set hop = params.Z_HOP|default(5.0)|float %}
    {% set ext = printer[printer.toolhead.extruder] %}
    {% set z_safe = [printer.gcode_move.gcode_position.z + hop,
                     printer.toolhead.axis_maximum.z|float]|min %}

    CANCEL_HEAT_SOAK
    TURN_OFF_HEATERS

    {% if 'xyz' in printer.toolhead.homed_axes %}
        SAVE_GCODE_STATE NAME=_CANCEL_PARK
        {% if ext.can_extrude and e > 0 %}
            M83
            G1 E-{e} F2100
        {% endif %}
        G90
        G1 Z{z_safe} F900
        SET_SKEW CLEAR=1
        {% if 'gcode_macro _FILAMENT_PARK' in printer %}
            _FILAMENT_PARK
        {% else %}
            G1 X20 Y300 F18000
        {% endif %}
        RESTORE_GCODE_STATE NAME=_CANCEL_PARK MOVE=0
    {% else %}
        { action_respond_info("CANCEL_PRINT: printer not homed, skipping park") }
    {% endif %}

    BED_MESH_CLEAR
    SET_SKEW CLEAR=1
    BUILTIN_CANCEL_PRINT
    STATUS_READY