# Modified from https://raw.githubusercontent.com/kyleisah/Klipper-Adaptive-Meshing-Purging/main/Configuration/Line_Purge.cfg
[gcode_macro LINE_PURGE]
description: A purge macro for flushing the toolhead.
gcode:
  {% set line_length = 100 | float %}    # X distance the line covers
  {% set bead_width  = 3.0 | float %}    # much wider than a print extrusion
  {% set bead_height = 0.8 | float %}
  {% set flow_rate   = 5.8 | float %}    # mm3/s

  {% set bead_area = bead_width * bead_height %}
  {% set filament_area = 3.14159265 * (printer.configfile.settings.extruder.filament_diameter / 2) ** 2 %}
  {% set purge_amount = line_length * bead_area / filament_area %}
  {% set purge_move_speed = (flow_rate / bead_area) * 60 %}
  {% set travel_speed = printer.toolhead.max_velocity * 60 | float %}
  {% set purge_x_start = (printer.toolhead.axis_maximum.x / 2) - (line_length / 2) %}
  {% set purge_y_start = printer.toolhead.axis_minimum.y + 3 | float %}

  {action_respond_info("LINE_PURGE: X%.1f Y%.1f  ->  X%.1f Y%.1f  at Z%.2f, %.1fmm filament, %.1f mm3/s" % (
      purge_x_start, purge_y_start,
      purge_x_start + line_length, purge_y_start,
      bead_height, purge_amount, flow_rate)) }

  SAVE_GCODE_STATE NAME=LINE_PURGE

# Reset extruder and make absolute move to initial purge position and height.
  G92 E0
  G0 F{travel_speed}
  G90
  G0 X{purge_x_start} Y{purge_y_start}
  G0 Z{bead_height}
  M83
  G1 X{purge_x_start + line_length} E{purge_amount} F{purge_move_speed}   # Purge line
  G10
  G0 X{purge_x_start + line_length + 10} F{travel_speed}                  # Rapid move to break string

# Reset extruder
  G92 E0
  M82
  G0 Z5 F{travel_speed}                                                   # Z hop
  G11

  RESTORE_GCODE_STATE NAME=LINE_PURGE
