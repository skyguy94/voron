[gcode_macro ERROR_PRINT]
description: Handler for virtual_sdcard on_error_gcode
gcode:
    {% set homed = 'xyz' in printer.toolhead.homed_axes %}
    {% set z_safe = [printer.gcode_move.gcode_position.z + 5.0,
                     printer.toolhead.axis_maximum.z|float]|min %}

    TURN_OFF_HEATERS

    {% if homed %}
        SAVE_GCODE_STATE NAME=_ERROR_PARK
        G90
        G1 Z{z_safe} F900
        _FILAMENT_PARK
        RESTORE_GCODE_STATE NAME=_ERROR_PARK MOVE=0
    {% endif %}

    STOP_HEAT_SOAK
    STATUS_PART_READY
    RESPOND TYPE=error MSG="Print error. Heaters off. {'Head parked, M24 retries the failed line' if homed else 'Not homed, toolhead left in place'}. CANCEL_PRINT to give up."
