[heatsoak]
rate_smooth_time: 120
report_interval: 90
complete_gcode:
    _HEAT_SOAK_SETTLE
    {% if printer.pause_resume.is_paused %}
        RESUME
    {% endif %}
cancel_gcode:
    {% if printer.print_stats.state in ('printing', 'paused') %}
        CANCEL_PRINT
    {% endif %}

[gcode_macro START_HEAT_SOAK]
description: Start the heatsoaking delay.
variable_print_bed: 0
variable_settle_seconds: 0
gcode:
    {% set bed = params.BED| default(60) | int %}
    {% set chamber = params.CHAMBER | default(50) | float %}
    {% set chamber_min = params.CHAMBER_MIN | default(chamber) | float %}
    {% set extruder_idle = params.EXTRUDER_IDLE | default(149) | float %}
    {% set timeout = params.TIMEOUT | default(90) | int %}
    {% set settle = params.SETTLE | default(60) | int %}

    # Soak hotter than the print needs so the chamber comes up faster, then drop
    # back and settle before anything is probed.
    {% set boost = params.SOAK_BOOST | default(10) | int %}
    {% set cutoff = params.SOAK_CUTOFF | default(100) | int %}
    {% set ceiling = [params.SOAK_MAX | default(120) | int,
                      printer.configfile.settings.heater_bed.max_temp | int - 5] | min %}
    {% set boosted = [bed + boost, ceiling] | min %}
    {% set soak_bed = params.SOAK_BED | default(boosted if bed >= cutoff else bed) | int %}

    # Detect when there's a flat temperature hold and end the soak
    # if that happens. A small chamber heater that can't the assigned
    # target would trigger this logic and save time.
    {% set flat_rate = params.FLAT_RATE | default(0.1) | float %}
    {% set flat_hold = params.FLAT_HOLD | default(300) | int %}
    {% set flat_floor = params.FLAT_FLOOR | default(8) | float %}
    {% set soak_floor = [chamber_min - flat_floor, 0] | max %}

    _STOP_SOAK

    SET_GCODE_VARIABLE MACRO=START_HEAT_SOAK VARIABLE=print_bed VALUE={bed}
    SET_GCODE_VARIABLE MACRO=START_HEAT_SOAK VARIABLE=settle_seconds VALUE={settle}

    {% if "xyz" not in printer.toolhead.homed_axes %}
        STATUS_HOMING
        G28
    {% endif %}
    M104 S{ extruder_idle }
    SET_HEATER_TEMPERATURE HEATER=chamber_heater TARGET={ chamber }

    {% if printer['virtual_sdcard'].is_active or printer['virtual_sdcard'].file_position != 0.0 %}
        PAUSE X={printer.toolhead.axis_maximum.x / 2} Y={printer.toolhead.axis_maximum.y / 2} CLEAN=0
    {% endif %}

    HEAT_SOAK HEATER='heater_bed' TARGET={ soak_bed } SOAKER='heater_generic chamber_heater' SOAK_TEMP={ chamber_min } TIMEOUT={ timeout } FLAT_RATE={ flat_rate } FLAT_HOLD={ flat_hold } SOAK_FLOOR={ soak_floor }

    G90
    G1 Z125 F600            ; Lower the bed to centrally heat the chamber


[gcode_macro _SOAK_POSITION]
description: Centre the toolhead and lower the bed so the chamber heats evenly. Params: Z
gcode:
    {% set z = params.Z | default(125) | float %}
    {% set z_safe = [z, printer.toolhead.axis_maximum.z | float] | min %}

    {% if "xyz" not in printer.toolhead.homed_axes %}
        STATUS_HOMING
        G28
    {% endif %}

    SAVE_GCODE_STATE NAME=_SOAK_POSITION
    G90
    G1 Z{z_safe} F600
    G1 X{printer.toolhead.axis_maximum.x / 2} Y{printer.toolhead.axis_maximum.y / 2} F15000
    RESTORE_GCODE_STATE NAME=_SOAK_POSITION MOVE=0


[gcode_macro _HEAT_SOAK_SETTLE]
description: Drop the bed from soak temperature to print temperature and let it stabilise
gcode:
    {% set v = printer['gcode_macro START_HEAT_SOAK'] %}
    {% set bed = v.print_bed | float %}
    {% set settle = v.settle_seconds | int %}
    {% set now = printer.heater_bed.target | float %}

    {% if bed > 0 and now > bed %}
        RESPOND MSG="Soak complete. Bed {now | round(0) | int} -> {bed | round(0) | int}, settling {settle}s before probing."
        M140 S{bed}
        {% if settle > 0 %}
            G4 P{settle * 1000}
        {% endif %}
    {% else %}
        RESPOND MSG="Soak complete."
    {% endif %}


[gcode_macro HEAT_SOAK_RESUME]
description: Resume during a heat soak. Skips the rest of the soak.
gcode:
    {% set ON_RESUME = (params.ON_RESUME | default("_RESUME_RESTORE")) | string %}
    {% if printer.heatsoak.stage in ('heating', 'soaking') %}
        SKIP_HEAT_SOAK
    {% else %}
        {ON_RESUME} {% for p in params %}{'%s=%s ' % (p, params[p])}{% endfor %}
    {% endif %}
