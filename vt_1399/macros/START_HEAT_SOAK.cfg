[gcode_macro START_HEAT_SOAK]
description: Start the heatsoaking delay.
variable_print_bed: 0
variable_settle_seconds: 0
gcode:
    {% set bed = params.BED| default(60) | int %}
    {% set chamber = params.CHAMBER | default(50) | float %}
    {% set extruder_idle = params.EXTRUDER_IDLE | default(149) | float %}
    {% set timeout = params.TIMEOUT | default(90) | int %}
    {% set settle = params.SETTLE | default(180) | int %}

    # Soak hotter than the print needs so the chamber comes up faster, then drop
    # back and settle before anything is probed. Hard-capped by the bed heater.
    # No boost below SOAK_CUTOFF - PLA and friends gain nothing from it.
    {% set boost = params.SOAK_BOOST | default(10) | int %}
    {% set cutoff = params.SOAK_CUTOFF | default(100) | int %}
    {% set ceiling = [params.SOAK_MAX | default(120) | int,
                      printer.configfile.settings.heater_bed.max_temp | int - 5] | min %}
    {% set boosted = [bed + boost, ceiling] | min %}
    {% set soak_bed = params.SOAK_BED | default(boosted if bed >= cutoff else bed) | int %}

    CANCEL_HEAT_SOAK

    SET_GCODE_VARIABLE MACRO=START_HEAT_SOAK VARIABLE=print_bed VALUE={bed}
    SET_GCODE_VARIABLE MACRO=START_HEAT_SOAK VARIABLE=settle_seconds VALUE={settle}

    {% if "xyz" not in printer.toolhead.homed_axes %}
        STATUS_HOMING
        G28
    {% endif %}
    G90
    G1 Z125 F600            ; Lower the bed to centrally heat the chamber

    M104 S{ extruder_idle }
    HEAT_SOAK HEATER='heater_bed' TARGET={ soak_bed } SOAKER='temperature_sensor chamber' SOAK_TEMP={ chamber } TIMEOUT={ timeout } COMPLETE=_HEAT_SOAK_SETTLE HEATING_REPORT_INTERVAL=90 SOAKING_REPORT_INTERVAL=90


[gcode_macro _HEAT_SOAK_SETTLE]
description: Drop the bed from soak temperature to print temperature and let it stabilise
gcode:
    {% set v = printer['gcode_macro START_HEAT_SOAK'] %}
    {% set bed = v.print_bed | float %}
    {% set settle = v.settle_seconds | int %}
    {% set now = printer.heater_bed.target | float %}

    {% if bed > 0 and now > bed %}
        RESPOND MSG="Soak complete. Bed {now | round(0) | int} -> {bed | round(0) | int}, settling {settle}s before probing."
        M140 S{bed}
        {% if settle > 0 %}
            G4 P{settle * 1000}
        {% endif %}
    {% else %}
        RESPOND MSG="Soak complete."
    {% endif %}
