[gcode_macro _SAFE_PARK]
description: Z hop clear of the part, then move to the service park. Params: Z_HOP X Y
gcode:
    {% set hop = params.Z_HOP|default(5.0)|float %}
    {% set override = 'X' in params or 'Y' in params %}
    {% set px = params.X|default(20)|float %}
    {% set py = params.Y|default(345)|float %}
    {% set z_safe = [printer.gcode_move.gcode_position.z|float + hop,
                     printer.toolhead.axis_maximum.z|float]|min %}

    {% if 'xyz' in printer.toolhead.homed_axes %}
        SAVE_GCODE_STATE NAME=_SAFE_PARK
        G90
        G1 Z{z_safe} F900
        {% if override or 'gcode_macro _FILAMENT_PARK' not in printer %}
            G1 X{px} Y{py} F18000
        {% else %}
            _FILAMENT_PARK
        {% endif %}
        RESTORE_GCODE_STATE NAME=_SAFE_PARK MOVE=0
    {% else %}
        { action_respond_info("_SAFE_PARK: printer not homed, skipping park") }
    {% endif %}


[gcode_macro _STOP_SOAK]
description: Stop an in-progress heat soak without running its callbacks
gcode:
    {% if 'heatsoak' in printer and printer.heatsoak.stage in ('heating', 'soaking') %}
        STOP_HEAT_SOAK
    {% endif %}
