[gcode_macro ERROR_PRINT]
description: Handler for virtual_sdcard on_error_gcode
gcode:
    {% set homed = 'xyz' in printer.toolhead.homed_axes %}
    {% set r = printer['gcode_macro _PRINT_RETRY'] %}
    {% set attempt = r.count|int + 1 %}
    {% set retry = homed and r.armed|int == 1 and attempt <= r.limit|int %}
    {% if not retry %}
        TURN_OFF_HEATERS
    {% endif %}

    _SAFE_PARK Z_HOP=5.0

    _STOP_SOAK

    {% if retry %}
        SET_GCODE_VARIABLE MACRO=_PRINT_RETRY VARIABLE=count VALUE={attempt}
        STATUS_CLEANING
        RESPOND MSG="Print start failed. Wiping the nozzle and starting over, attempt {attempt} of {r.limit|int}. Heaters left on."
        UPDATE_DELAYED_GCODE ID=_PRINT_RETRY_RUN DURATION=2
    {% else %}
        SET_GCODE_VARIABLE MACRO=_PRINT_RETRY VARIABLE=armed VALUE=0
        STATUS_PART_READY
        RESPOND TYPE=error MSG="Print error. Heaters off. {'Head parked. Reheat the hotend, then M24 retries the failed line' if homed else 'Not homed, toolhead left in place'}. CANCEL_PRINT to give up."
    {% endif %}
