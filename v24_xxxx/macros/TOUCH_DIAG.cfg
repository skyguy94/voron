[gcode_macro TOUCH_AB_TEST]
description: Touch repeatability with and without a nozzle clean. Params: SAMPLES ROUNDS X Y
gcode:
    {% if "xyz" not in printer.toolhead.homed_axes %}
        { action_raise_error("TOUCH_AB_TEST: home all axes first") }
    {% endif %}
    {% if printer.extruder.target > 150 %}
        { action_raise_error("TOUCH_AB_TEST: set the nozzle to 150C or lower first") }
    {% endif %}

    {% set samples = params.SAMPLES|default(10)|int %}
    {% set rounds  = params.ROUNDS|default(3)|int %}
    {% set x       = params.X|default(printer.gcode_move.gcode_position.x)|float %}
    {% set y       = params.Y|default(printer.gcode_move.gcode_position.y)|float %}

    SAVE_GCODE_STATE NAME=TOUCH_AB_TEST
    G90

    {% for r in range(rounds) %}
        RESPOND TYPE=echo MSG="TOUCH_AB_TEST round {r + 1}/{rounds} at X{x} Y{y} -- cleaning"
        CLEAN_NOZZLE
        G0 X{x} Y{y} F18000
        M400
        RESPOND TYPE=echo MSG="TOUCH_AB_TEST round {r + 1}/{rounds} -- A: immediately after clean"
        CARTOGRAPHER_TOUCH_ACCURACY SAMPLES={samples}
        RESPOND TYPE=echo MSG="TOUCH_AB_TEST round {r + 1}/{rounds} -- B: repeat, no clean"
        CARTOGRAPHER_TOUCH_ACCURACY SAMPLES={samples}
    {% endfor %}

    RESPOND TYPE=echo MSG="TOUCH_AB_TEST done. Compare A vs B stdev. Reference good result is stdev under 0.001 and range under 0.003."
    RESTORE_GCODE_STATE NAME=TOUCH_AB_TEST

[gcode_macro TOUCH_SITE_TEST]
description: Touch repeatability at several bed locations to separate nozzle from bed-surface causes. Params: SAMPLES
gcode:
    {% if "xyz" not in printer.toolhead.homed_axes %}
        { action_raise_error("TOUCH_SITE_TEST: home all axes first") }
    {% endif %}
    {% if printer.extruder.target > 150 %}
        { action_raise_error("TOUCH_SITE_TEST: set the nozzle to 150C or lower first") }
    {% endif %}

    {% set samples = params.SAMPLES|default(8)|int %}
    {% set sites = [[150, 150], [90, 150], [210, 150], [150, 90], [150, 210]] %}

    SAVE_GCODE_STATE NAME=TOUCH_SITE_TEST
    G90
    CLEAN_NOZZLE

    {% for s in sites %}
        G0 X{s[0]} Y{s[1]} F18000
        M400
        RESPOND TYPE=echo MSG="TOUCH_SITE_TEST at X{s[0]} Y{s[1]}"
        CARTOGRAPHER_TOUCH_ACCURACY SAMPLES={samples}
    {% endfor %}

    RESPOND TYPE=echo MSG="TOUCH_SITE_TEST done. Scatter that follows one site is the bed surface. Scatter everywhere is the toolhead or Z motion."
    RESTORE_GCODE_STATE NAME=TOUCH_SITE_TEST
