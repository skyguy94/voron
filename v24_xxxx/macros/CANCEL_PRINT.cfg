[gcode_macro CANCEL_PRINT]
rename_existing: BUILTIN_CANCEL_PRINT
description: Cancel print
gcode:
    {% set e   = params.E|default(1.5)|float %}
    {% set hop = params.Z_HOP|default(5.0)|float %}
    {% set ext = printer[printer.toolhead.extruder] %}
    _STOP_SOAK
    TURN_OFF_HEATERS

    {% if 'xyz' in printer.toolhead.homed_axes %}
        {% if ext.can_extrude and e > 0 %}
            SAVE_GCODE_STATE NAME=_CANCEL_RETRACT
            M83
            G1 E-{e} F2100
            RESTORE_GCODE_STATE NAME=_CANCEL_RETRACT MOVE=0
        {% endif %}
        SET_SKEW CLEAR=1
        _SAFE_PARK Z_HOP={hop}
    {% else %}
        { action_respond_info("CANCEL_PRINT: printer not homed, skipping park") }
    {% endif %}

    SET_GCODE_VARIABLE MACRO=_PRINT_RETRY VARIABLE=armed VALUE=0
    SET_GCODE_VARIABLE MACRO=_PRINT_RETRY VARIABLE=count VALUE=0
    BED_MESH_CLEAR
    SET_SKEW CLEAR=1
    BUILTIN_CANCEL_PRINT
    STATUS_READY