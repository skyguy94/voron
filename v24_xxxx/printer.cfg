#####################################################################
#   Chamber Control
#####################################################################

[heater_bed]
heater_pin: HEATER_BED
sensor_type: ATC Semitec 104NT-4-R025H42G
sensor_pin: TH0
pullup_resistor: 2200
min_temp: 0
max_temp: 125
control = pid
pid_kp = 63.289
pid_ki = 2.099
pid_kd = 477.038

#[temperature_sensor chamber]
#sensor_type: Generic 3950
#sensor_pin: TH1
#pullup_resistor: 2200
#min_temp: 0
#max_temp: 100
#gcode_id: C

#####################################################################
#	Voltage Monitor
#####################################################################

[adc_temperature 5V_Monitor]
temperature1: 5
voltage1: 3.0
temperature2: 4
voltage2: 2.4
temperature3: 3
voltage3: 1.8

[adc_temperature 24V_Monitor]
temperature1: 24
voltage1: 3.13
temperature2: 22
voltage2: 2.87
temperature3: 21
voltage3: 2.74

#[temperature_sensor toolhead_5V]
#sensor_type: 5V_Monitor
#sensor_pin: toolhead:V5_MON
#adc_voltage: 3.3
#voltage_offset: 0

#[temperature_sensor toolhead_24V]
#sensor_type: 24V_Monitor
#sensor_pin: toolhead:V24_MON
#adc_voltage: 3.3
#voltage_offset: 0

#####################################################################
#	Electronics Fans
#####################################################################

[temperature_fan mcu_fan]
pin: FAN2
sensor_type: temperature_mcu
control: watermark
max_power: 0.4
shutdown_speed: 0.0
min_temp: 10
max_temp: 80
target_temp: 40

[temperature_sensor raspberry_pi]
sensor_type: temperature_host
min_temp: 10
max_temp: 100

#[temperature_sensor H36]
#sensor_type: Generic 3950
#sensor_pin: toolhead:TH1
#min_temp:0
#max_temp:150

#[nevermore]
#bt_address: 28:CD:C1:0D:0B:2E
#fan_power_coefficient: 0.75

#####################################################################
#	LED Control
#####################################################################

[led chamber]
white_pin: LED_STRIP
initial_WHITE: 1.0

#[neopixel sb_leds]
#pin: toolhead:RGBLED
#chain_count: 3
#color_order: GRB, GRB, GRB
#initial_RED: 0.0
#initial_GREEN: 1.0
#initial_BLUE: 1.0
#initial_WHITE: 0.0

# Set RGB values on boot up for each Neopixel.
# Index 1 = display, Index 2 and 3 = Knob
[delayed_gcode setdisplayneopixel]
initial_duration: 1
gcode:
   SET_LED LED=fysetc_mini12864 RED=1 GREEN=1 BLUE=1 INDEX=1 TRANSMIT=0
   SET_LED LED=fysetc_mini12864 RED=1 GREEN=0 BLUE=0 INDEX=2 TRANSMIT=0
   SET_LED LED=fysetc_mini12864 RED=1 GREEN=0 BLUE=0 INDEX=3

#####################################################################
#	Homing and Gantry Adjustment Routines
#####################################################################

[idle_timeout]
timeout: 3600

[safe_z_home]
home_xy_position:-10,-10
speed:100
z_hop:10
z_hop_speed:10

[quad_gantry_level]
gantry_corners:
   -60,-10
   410,420
points:
   50,25
   50,275
   300,275
   300,25

[bed_mesh]
speed: 300
horizontal_move_z: 3
algorithm: bicubic
mesh_min: 30, 20
mesh_max: 270,265
probe_count: 20,20
zero_reference_position: 150,150

#####################################################################
#	Displays
#####################################################################

# mini12864 LCD Display
[display]
lcd_type: uc1701
cs_pin: LCD_EN
a0_pin: LCD_RS
rst_pin: LCD_D4
encoder_pins: ^BTN_EN1,^BTN_EN2
click_pin: ^!BTN_ENC
contrast: 63
spi_software_mosi_pin: SPI_MOSI
spi_software_miso_pin: SPI_MISO
spi_software_sclk_pin: SPI_SCK

[neopixel fysetc_mini12864]
pin: LCD_D5
chain_count: 3
initial_RED: 0.1
initial_GREEN: 0.5
initial_BLUE: 0.0
color_order: RGB

[menu __main __tune]
type: disabled

[menu __main __octoprint]
type: disabled

[menu __main __sdcard]
type: disabled

[menu __main __control __clean_nozzle]
type: command
enable: {not printer.idle_timeout.state == "Printing"}
name: Clean Nozzle
index: 4
gcode: CLEAN_NOZZLE

