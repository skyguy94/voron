[gcode_macro _BED_CHECK_VARS]
variable_park_x: 5.0
variable_park_y: 5.0
variable_check_z: 25.0
variable_travel_margin: 20.0
variable_min_clearance: 40.0
gcode:

[gcode_macro SAFE_BED_CHECK]
description: Lower the bed clear of the last print, park, and camera-check the bed
gcode:
    {% set v = printer['gcode_macro _BED_CHECK_VARS'] %}
    {% set check_z = params.Z|default(v.check_z)|float %}
    {% set require = params.REQUIRE_CLEAR|default(1)|int %}
    {% set train = params.TRAIN|default(1)|int %}

    {% if 'xyz' not in printer.toolhead.homed_axes %}
        { action_raise_error("SAFE_BED_CHECK needs a homed machine. Z is unknown, so the bed cannot be moved clear of anything on it.") }
    {% endif %}

    BED_CHECK_PREPARE
    {% set last_h = printer.bedcheck.last_object_height|float %}
    {% set clearance = [ last_h + v.travel_margin, v.min_clearance ]|max %}

    {% if last_h < 0 %}
        RESPOND MSG="Bed check: previous job height unknown, using {clearance|round(1)}mm clearance"
    {% else %}
        RESPOND MSG="Bed check: last print {last_h|round(1)}mm tall, travelling at {clearance|round(1)}mm"
    {% endif %}

    G90
    G0 Z{ clearance } F1200
    G0 X{ v.park_x } Y{ v.park_y } F18000

    {% if last_h >= check_z %}
        { action_raise_error("Last print was %.1fmm tall and the camera pose is Z%.1f. Descending could hit it. Clear the bed and confirm before homing." | format(last_h, check_z)) }
    {% endif %}

    G0 Z{ check_z } F1200
    M400
    BED_CHECK Z={ check_z } REQUIRE_CLEAR={ require } TRAIN={ train }
